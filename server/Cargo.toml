[package]
name = "job_portal"
version = "0.4.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.6" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
surrealdb = { version = "2.4.0", features = ["kv-rocksdb"] }
tokio = { version = "1", features = ["full"] }
jsonwebtoken = "9"
bcrypt = "0.17.1"
chrono = "0.4"
tower = "0.5.2"
tower-http = { version = "0.6.8", features = ["cors"] }
rand = "0.9.2"
futures = "0.3.31"
